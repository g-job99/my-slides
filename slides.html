        render: () => `
          <div>
            <span class="inline-block px-3 py-1 rounded-lg bg-teal-50 text-teal-800 text-xs font-extrabold tracking-widest uppercase mb-3">FAQ · 常見迷思破解</span>
            <h2 class="text-2xl sm:text-3xl font-extrabold text-warm-ink">求職同學最常問的 6 個關鍵問題</h2>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-3 my-4">
            ${[
              { q: 'Q1 履歷一定要一頁嗎？', a: '新鮮人／轉職初階建議控制在 1–2 頁。重點是「相關性與可讀性」，不是把字縮到很小硬塞成一頁。' },
              { q: 'Q2 沒有相關工作經驗怎麼辦？', a: '把技術培訓、完整專案、GitHub 作品集與可轉移能力往前放。你的專案就是目前最重要的工作樣本。' },
              { q: 'Q3 專案是團體做的，可以寫嗎？', a: '完全可以，但務必清楚標註「你個人負責哪一塊」，不要把整組的成果模糊算成自己的。' },
              { q: 'Q4 不太會的技術要寫上去嗎？', a: '不要。面試官會直接從履歷出題。剛學過可標註「基礎／接觸」，千萬不要包裝成熟練。' },
              { q: 'Q5 面試技術題答不出來怎麼辦？', a: '先釐清題意，再說出你目前知道的部分與推理方向。技術面試官同時在觀察你如何處理未知問題。' },
              { q: 'Q6 收到 Offer 但還在等別間決定？', a: '禮貌與 HR 確認回覆期限，並在期限內給出明確答覆。切忌無故消失，也不要同時承諾多家公司到職。' }
            ].map(item => `
              <div class="bg-warm-soft/70 border border-warm-border rounded-2xl p-3.5">
                <h3 class="font-bold text-sm text-amber-800 mb-1">${item.q}</h3>
                <p class="text-xs text-warm-ink leading-relaxed">${item.a}</p>
              </div>
            `).join('')}
          </div>
        `
      },

      // Slide 25: ACTION
      {
        tag: "ACTION",
        title: "今天下課後，請完成這 4 件事",
        render: () => `
          <div>
            <span class="inline-block px-3 py-1 rounded-lg bg-amber-100 text-amber-800 text-xs font-extrabold tracking-widest uppercase mb-3">ACTION · 課後行動清單</span>
            <h2 class="text-2xl sm:text-3xl font-extrabold text-warm-ink">今天下課後，請立刻完成這 4 件事</h2>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 my-6">
            ${[
              { num: '01', title: '選 1 個真的想投的 JD', desc: '打開求職網站，挑出你最心儀的一份工程師職缺並拆解關鍵字' },
              { num: '02', title: '依 JD 重排技能與專案', desc: '把最符合該職缺的技能樹與代表專案調整到第一頁視覺焦點' },
              { num: '03', title: '改寫 1 個核心專案', desc: '套用「動作 ＋ 技術 ＋ 對象 ＋ 結果」公式重寫專案描述' },
              { num: '04', title: '準備自介與 5 個故事', desc: '計時練習 60 秒自我介紹，並寫下 5 個 STAR 行為面試草稿' }
            ].map(act => `
              <div class="bg-white border-2 border-amber-200 rounded-2xl p-5 shadow-sm flex flex-col justify-between">
                <div>
                  <span class="text-3xl font-black text-amber-600 block mb-3">${act.num}</span>
                  <h3 class="font-extrabold text-base text-warm-ink mb-2">${act.title}</h3>
                  <p class="text-xs text-warm-muted leading-relaxed">${act.desc}</p>
                </div>
              </div>
            `).join('')}
          </div>
          <div class="bg-teal-900 text-white rounded-2xl p-5 text-center">
            <p class="text-sm sm:text-base font-medium">
              你不需要看起來像「什麼都會的資深架構師」。<br/>
              你需要讓企業清楚看見：<strong class="text-amber-300">「你已經準備好從 Junior 的位置開始解決問題。」</strong>
            </p>
          </div>
        `
      },

      // Slide 26: CLOSING & Q&A
      {
        tag: "Q & A",
        title: "履歷寫完，不是結束。是你開始跟市場對話。",
        render: () => `
          <div class="flex-1 flex flex-col justify-center items-center text-center">
            <div class="w-16 h-16 rounded-3xl bg-amber-100 text-amber-600 flex items-center justify-center mb-6 shadow-sm">
              <i data-lucide="rocket" class="w-8 h-8"></i>
            </div>
            <h2 class="text-3xl sm:text-5xl font-black text-warm-ink leading-tight mb-4">
              履歷寫完，不是結束。<br/>
              是你開始<span class="text-teal-700">跟市場對話</span>。
            </h2>
            <p class="text-base sm:text-lg text-warm-muted max-w-xl mb-8">
              每一次投遞與面試都是寶貴的系統回饋，持續迭代你的履歷版本！
            </p>

            <!-- 循環流程圖 -->
            <div class="flex flex-wrap items-center justify-center gap-2 sm:gap-3 mb-10">
              ${['投遞履歷', '獲得面試', '記錄問題', '優化修履歷', '再次投遞'].map((step, idx, arr) => `
                <span class="px-4 py-2 rounded-xl bg-warm-soft border border-warm-border font-bold text-sm text-warm-ink shadow-sm">${step}</span>
                ${idx < arr.length - 1 ? '<i data-lucide="arrow-right" class="w-4 h-4 text-amber-600"></i>' : ''}
              `).join('')}
            </div>

            <div class="px-8 py-3 rounded-2xl bg-amber-600 text-white font-black text-xl tracking-widest shadow-warm">
              Q & A 交流時間
            </div>
          </div>
        `
      }
    ];

    let currentSlide = 0;

    // 讀取網址 Hash（例如 slides.html#9 -> 第 9 頁，index 為 8）
    function getInitialSlideFromHash() {
      const hash = window.location.hash.replace('#', '');
      const pageNum = parseInt(hash, 10);
      if (!isNaN(pageNum) && pageNum >= 1 && pageNum <= slides.length) {
        return pageNum - 1;
      }
      return 0;
    }

    // 渲染當前投影片
    function renderSlide(index, updateHash = true) {
      if (index < 0) index = 0;
      if (index >= slides.length) index = slides.length - 1;
      currentSlide = index;

      const slideEl = document.getElementById('slide-content');
      const slideData = slides[currentSlide];

      // 過場淡入效果
      slideEl.classList.remove('slide-active');
      slideEl.classList.add('slide-enter');

      setTimeout(() => {
        slideEl.innerHTML = slideData.render();
        lucide.createIcons();
        slideEl.classList.remove('slide-enter');
        slideEl.classList.add('slide-active');
      }, 120);

      // 更新進度條與頁碼
      const progress = ((currentSlide + 1) / slides.length) * 100;
      document.getElementById('progress-bar').style.width = `${progress}%`;
      document.getElementById('page-indicator').textContent = `${currentSlide + 1} / ${slides.length}`;

      // 更新按鈕禁用狀態
      document.getElementById('btn-prev').disabled = currentSlide === 0;
      document.getElementById('btn-next').disabled = currentSlide === slides.length - 1;

      // 更新網址錨點
      if (updateHash) {
        history.replaceState(null, '', `#${currentSlide + 1}`);
      }
    }

    function nextSlide() {
      if (currentSlide < slides.length - 1) {
        renderSlide(currentSlide + 1);
      }
    }

    function prevSlide() {
      if (currentSlide > 0) {
        renderSlide(currentSlide - 1);
      }
    }

    function goToSlide(index) {
      renderSlide(index);
      toggleOverview(false);
    }

    // 目錄總覽開關
    function toggleOverview(forceState) {
      const modal = document.getElementById('overview-modal');
      const isHidden = modal.classList.contains('hidden');
      const shouldShow = typeof forceState === 'boolean' ? forceState : isHidden;

      if (shouldShow) {
        renderOverviewGrid();
        modal.classList.remove('hidden');
      } else {
        modal.classList.add('hidden');
      }
    }

    function renderOverviewGrid() {
      const grid = document.getElementById('overview-grid');
      grid.innerHTML = slides.map((s, idx) => `
        <button onclick="goToSlide(${idx})" class="text-left p-4 rounded-2xl border transition cursor-pointer flex flex-col justify-between ${idx === currentSlide ? 'bg-amber-50 border-amber-500 ring-2 ring-amber-200' : 'bg-white border-warm-border hover:border-amber-300'}">
          <div class="flex items-center justify-between mb-2">
            <span class="text-[11px] font-extrabold uppercase tracking-wider px-2 py-0.5 rounded bg-warm-soft text-teal-800">${s.tag}</span>
            <span class="text-xs font-bold text-warm-muted">#${idx + 1}</span>
          </div>
          <p class="text-sm font-bold text-warm-ink line-clamp-2">${s.title}</p>
        </button>
      `).join('');
    }

    // 全螢幕切換
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    // 鍵盤快捷鍵監聽
    document.addEventListener('keydown', (e) => {
      const modalOpen = !document.getElementById('overview-modal').classList.contains('hidden');
      if (e.key === 'Escape' && modalOpen) {
        toggleOverview(false);
        return;
      }
      if (e.key.toLowerCase() === 'g') {
        toggleOverview();
        return;
      }
      if (modalOpen) return;

      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
        e.preventDefault();
        nextSlide();
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        e.preventDefault();
        prevSlide();
      } else if (e.key === 'Home') {
        renderSlide(0);
      } else if (e.key === 'End') {
        renderSlide(slides.length - 1);
      }
    });

    // 手機觸控左右滑動換頁支援
    let touchStartX = 0;
    let touchEndX = 0;
    const stage = document.getElementById('slide-stage');

    stage.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    stage.addEventListener('touchend', (e) => {
      touchEndX = e.changedTouches[0].screenX;
      const diff = touchStartX - touchEndX;
      if (Math.abs(diff) > 50) {
        if (diff > 0) nextSlide();
        else prevSlide();
      }
    }, { passive: true });

    // 監聽瀏覽器上一頁 / 下一頁 Hash 變化
    window.addEventListener('hashchange', () => {
      renderSlide(getInitialSlideFromHash(), false);
    });

    // 初始化
    window.onload = function () {
      lucide.createIcons();
      renderSlide(getInitialSlideFromHash(), true);
    };
  </script>
</body>
</html>
